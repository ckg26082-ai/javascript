<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>見出し</H1>
    <P>ここを書き換えます。</P>

    <button onclick="action()">
        文字を書き換える
    </button>
    <script>
        function action(){
            document.querySelector("p").textContent="ここを書き換えました。"
        }
    </script>
</body>
</html>
